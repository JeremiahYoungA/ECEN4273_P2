nc: 3
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]

backbone  :
  - [-1, 1, Conv, [64, 3, 2]]         # P1
  - [-1, 1, Conv, [128, 3, 2]]        # P2
  - [-1, 2, C3k2, [256, False, 0.25]] # P1/2 not detected
  - [-1, 1, Conv, [256, 3, 2]]        # P3
  - [-1, 1, C3k2, [512, False, 0.25]] # P3 not detected
  - [-1, 1, Conv, [512, 3, 2]]        # P4
  - [-1, 2, C3k2, [512, True]]   
  - [-1, 1, Conv, [1024, 3, 2]]       # P5
  - [-1, 2, C3k2, [1024, True]]       
  - [-1, 1, SPPF, [1024, 5, 3, True]]  
  - [-1, 2, C2PSA, [1024]]           


head:
  # Build P4 features
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  # Build P5 features
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]

  # Detect using P4 and P5 only
  - [[13, 16], 1, Detect, [nc]]